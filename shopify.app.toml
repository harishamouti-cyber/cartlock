# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "72d1db31ff4a8c7b6e398c0aa0892f31"
name = "CartLock"
handle = "cartlock-1"
application_url = "https://cartlock-harisalfarees-6035s-projects.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "rankpilot-xk8wrvgu.myshopify.com"
include_config_on_deploy = true

[access_scopes]
# Scopes for Discount Function sync, Catalog media queries, and Order attribution webhooks
scopes = "read_products,read_discounts,write_discounts,read_orders"

[auth]
redirect_urls = [
  "https://cartlock-harisalfarees-6035s-projects.vercel.app/auth/callback",
  "https://cartlock-harisalfarees-6035s-projects.vercel.app/auth/shopify/callback",
  "https://cartlock-harisalfarees-6035s-projects.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [webhooks.privacy_compliance]
  customer_deletion_url = "/webhooks"
  customer_data_request_url = "/webhooks"
  shop_deletion_url = "/webhooks"

[app_proxy]
url = "https://cartlock-harisalfarees-6035s-projects.vercel.app/api/storefront/lock"
subpath = "cartlock"
prefix = "apps"

[pos]
embedded = false
